{% comment %}
Molde dos e-mails com link: recuperacao, convite e troca de e-mail.

E-mail nao e pagina. As regras que ditam este HTML:

- **tabela para layout, e nao flex ou grid**: o Outlook renderiza com o motor do
  Word, que ignora os dois;
- **estilo inline**: o Gmail corta `<style>` em boa parte dos casos e nunca
  aceita folha externa;
- **fonte do sistema**: `<link>` para webfont e removido, entao a pilha comum
  e o que sobra;
- **sem imagem**: a marca e texto de proposito. Cliente de e-mail bloqueia
  imagem por padrao, e um logo que nao carrega deixa um retangulo quebrado no
  lugar mais visivel da mensagem;
- **o endereco cru fica so na versao em texto**: no HTML ele poluia o corpo
  logo abaixo do botao, e quem precisa dele (cliente que desativa link) e
  justamente quem cai na versao em texto.
{% endcomment %}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ titulo }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f7f9;">

<!-- Resumo que o cliente mostra na lista, antes de abrir. O espacamento
     depois impede que ele emende com o texto do corpo. -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ resumo }}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f6f7f9;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:560px; max-width:100%;">

        <tr>
          <td style="padding:0 4px 18px 4px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:700; letter-spacing:2px; color:#0b3d66;">
            VAGGIO
          </td>
        </tr>

        <tr>
          <td style="background-color:#ffffff; border:1px solid #e3e6ea; border-radius:10px; padding:32px;">

            <h1 style="margin:0 0 18px 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:21px; line-height:1.3; font-weight:600; color:#16181d;">
              {{ titulo }}
            </h1>

            {% for paragrafo in paragrafos %}
            <p style="margin:0 0 14px 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#16181d;">
              {{ paragrafo }}
            </p>
            {% endfor %}

            <!-- Botao em tabela, e nao <a> com padding: o Outlook ignora
                 padding no <a> e o botao vira um link solto no meio da
                 mensagem. O bgcolor duplicado cobre cliente que descarta CSS. -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 18px 0;">
              <tr>
                <td bgcolor="#0b3d66" style="background-color:#0b3d66; border-radius:8px;">
                  <a href="{{ url }}" style="display:inline-block; padding:13px 26px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:8px;">
                    {{ rotulo }}
                  </a>
                </td>
              </tr>
            </table>

            {% if rodape %}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="padding-top:22px; border-top:1px solid #e3e6ea;">
                  {% for linha in rodape %}
                  <p style="margin:0 0 8px 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:1.6; color:#6b7280;">
                    {{ linha }}
                  </p>
                  {% endfor %}
                </td>
              </tr>
            </table>
            {% endif %}

          </td>
        </tr>

        <tr>
          <td style="padding:16px 4px 0 4px; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#6b7280;">
            Vaggio · mensagem automática, não responda este e-mail.
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
